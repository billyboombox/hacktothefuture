<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boombox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ EDIT ME: THEME (change these to restyle the whole app) ============ */
:root{
  --bg-top:#12002b; --bg-mid:#2a0a4f; --bg-bottom:#4a0f5c;   /* night sky */
  --pink:#ff2e93; --cyan:#19f0ff; --sun-top:#ffd400; --sun-bottom:#ff5e3a;
  --text:#f4eaff; --muted:#b9a3d9; --card:rgba(30,8,60,.78);
  --font-title:'Monoton',cursive; --font-body:'Chakra Petch',system-ui,sans-serif;
  --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ============ LAYOUT & COMPONENTS ============ */
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font:400 16px/1.5 var(--font-body);
  background:linear-gradient(var(--bg-top),var(--bg-mid) 60%,var(--bg-bottom)) fixed;overflow-x:hidden}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:45vh;z-index:-1;transform:perspective(300px) rotateX(60deg);transform-origin:bottom;
  background:linear-gradient(transparent,rgba(255,46,147,.3)),
  repeating-linear-gradient(90deg,rgba(25,240,255,.35) 0 2px,transparent 2px 60px),
  repeating-linear-gradient(0deg,rgba(25,240,255,.35) 0 2px,transparent 2px 40px)}
main{max-width:960px;margin:0 auto;padding:28px 18px 80px}
header{text-align:center;margin-bottom:26px}
.sun{position:relative;width:150px;height:150px;margin:0 auto -50px;border-radius:50%;overflow:hidden;
  background:linear-gradient(var(--sun-top),var(--sun-bottom) 55%,var(--pink))}
.sun::after{content:"";position:absolute;inset:50% 0 0;background:repeating-linear-gradient(transparent 0 7px,var(--bg-mid) 7px 11px)}
h1{position:relative;margin:0;font:400 clamp(2.2rem,8vw,4.2rem)/1.05 var(--font-title);letter-spacing:.04em;color:var(--cyan);
  text-shadow:0 0 8px var(--cyan),0 0 26px var(--pink),3px 3px 0 var(--pink)}
.tag{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.panel{background:var(--card);border:2px solid var(--cyan);border-radius:var(--radius);padding:20px;
  box-shadow:0 0 22px rgba(25,240,255,.35),inset 0 0 18px rgba(255,46,147,.15);backdrop-filter:blur(4px)}
label.lbl,legend{display:block;font-weight:700;margin-bottom:8px;color:var(--cyan);padding:0}
fieldset{border:0;margin:18px 0 0;padding:0}
input[type=text],input[type=password]{width:100%;padding:13px 14px;font:inherit;color:var(--text);background:rgba(0,0,0,.35);
  border:2px solid var(--pink);border-radius:10px}
input:focus-visible,button:focus-visible,summary:focus-visible,.pill:has(input:focus-visible){outline:3px solid var(--sun-top);outline-offset:2px}
.pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pill{position:relative;text-align:center;padding:13px 10px;border:2px solid var(--muted);border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.pill input{position:absolute;opacity:0}
.pill:has(input:checked){border-color:var(--sun-top);color:#1a0033;background:linear-gradient(var(--sun-top),var(--sun-bottom));box-shadow:0 0 16px var(--sun-bottom)}
.btn{font:700 1rem var(--font-body);cursor:pointer;color:#fff;background:var(--pink);border:0;border-radius:10px;padding:13px 22px;
  box-shadow:4px 4px 0 var(--cyan);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--cyan)}
.btn.alt{background:transparent;border:2px solid var(--cyan);color:var(--cyan);box-shadow:none}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.chip{font:inherit;font-size:.9rem;color:var(--text);background:rgba(255,255,255,.08);border:1px dashed var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer}
.msg{color:var(--sun-top);margin:10px 0 0;min-height:1.4em}
details{margin-top:16px;color:var(--muted);font-size:.9rem}
summary{cursor:pointer}
#out{margin-top:28px}
.summary{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.energy{background:var(--pink);color:#fff;font-weight:700;padding:4px 12px;border-radius:20px;box-shadow:0 0 12px var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:2px solid var(--pink);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 16px rgba(255,46,147,.35)}
.art{position:relative;aspect-ratio:1;background:linear-gradient(135deg,var(--pink),var(--bg-mid) 70%,var(--cyan))}
.art::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;color:rgba(255,255,255,.7)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:1.2rem;color:var(--sun-top)}
.info .by{color:var(--cyan);font-weight:600}
.info p{margin:0;color:var(--text);flex:1}
.info a{color:var(--pink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--pink);align-self:flex-start}
.sk{min-height:330px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.14),rgba(255,255,255,.05)) 0 0/200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--radius)}
@keyframes sh{to{background-position:-200% 0}}
.pl{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:t}
.pl li{counter-increment:t;display:grid;grid-template-columns:auto 64px 1fr;gap:14px;align-items:center;background:var(--card);border:2px solid var(--cyan);border-radius:var(--radius);padding:10px 14px}
.pl li::before{content:counter(t);font:400 1.6rem var(--font-title);color:var(--pink)}
.pl .art{width:64px;border-radius:8px;overflow:hidden}.pl .art::before{font-size:1.6rem}
.pl b{color:var(--sun-top)}.pl small{display:block;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;align-self:flex-start}
.info .links a,.pl .links a{color:var(--pink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--pink)}
.info .links a.sp,.pl .links a.sp{color:var(--cyan);border-bottom-color:var(--cyan)}
.pl .links{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<main>
  <header>
    <div class="sun" aria-hidden="true"></div>
    <h1 id="appname">Boombox</h1>
    <p class="tag" id="tagline">What should I listen to while I work on this?</p>
  </header>

  <section class="panel">
    <label class="lbl" for="task">What are you working on?</label>
    <input id="task" type="text" maxlength="200" placeholder="I'm designing a presentation for an upcoming marketing meeting." autocomplete="off">
    <fieldset><legend>How long will it take?</legend><div class="pills" id="lengths"></div></fieldset>
    <div class="row"><button class="btn" id="go">Find my music</button>
      <span>Try:</span><button class="chip" data-t="I'm writing a campaign email for a new product launch." data-l="Less than 1 hour">Launch email</button>
      <button class="chip" data-t="I'm designing a new presentation for a client meeting." data-l="1–2 hours">Client deck</button></div>
    <p class="msg" id="msg" role="status"></p>
    
  </section>
  <section id="out" aria-live="polite"></section>
</main>

<script>

const LIBRARY = ROWS.map(([task,title,artist,yt,vibe,len]) => ({task,title,artist,youtubeUrl: yt.length===11 ? 'https://www.youtube.com/watch?v='+yt : yt, vibe, len: len||''}));

const isEgg = (task,len) => /hack to the future/i.test(task) && (len==='2+ hours' || /over 2 hours/i.test(task));
const DECK_EGG_URL = 'https://www.youtube.com/watch?v=QDia3e12czc';   // every result links here for the Client deck easter egg
const isDeckEgg = task => task.trim().toLowerCase() === "i'm designing a new presentation for a client meeting.";

/* ============ APP LOGIC (no need to edit below unless changing behavior) ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.title = CONFIG.appName; $('#appname').textContent = CONFIG.appName; $('#tagline').textContent = CONFIG.tagline;
let sampleFn = null, recent = [], last = null;

$('#lengths').innerHTML = Object.keys(LENGTHS).map((k,i) =>
  `<label class="pill"><input type="radio" name="len" value="${esc(k)}">${esc(k)}</label>`).join('');
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  $('#task').value = c.dataset.t;
  document.querySelectorAll('input[name=len]').forEach(r => r.checked = r.value === c.dataset.l);

const vid = u => { const m = (u||'').match(/(?:v=|youtu\.be\/)([\w-]{11})/); return m && m[1]; };
const norm = s => String(s).toLowerCase().trim();

/*ENGINE-START*/
/* ============ EDIT ME: RULE-BASED RECOMMENDATION ENGINE (no AI, no API key) ============
   1) Keywords in the task pick a category (RULES).  2) Task length sets the energy target.
   3) Every song is scored on category fit, length fit, energy, vocals and library membership. */
const CAT = {W:'Copy Writing',P:'Presentation Building',D:'Design',A:'Data Analysis/Reporting',R:'Research',B:'Brainstorming',L:'Learning',E:'Event Planning',S:'Strategy Planning',C:'Coding',O:'SEO',U:'User Research'};
/* Order matters: on a tie the earlier category wins. */
const RULES = {
  P:/presentation|deck|slide|pitch|keynote|speech|webinar|demo/g,
  W:/writ|copy|email|newsletter|blog|article|caption|headline|draft|proofread|content|essay|post/g,
  D:/design|mockup|logo|layout|illustrat|graphic|figma|photoshop|brand|creative|storyboard|\bui\b|\bux\b|video/g,
  A:/data|analy|report|spreadsheet|excel|dashboard|metric|kpi|sql|forecast|budget|financ/g,
  R:/research|investigat|competitor|market|read|literature|look into/g,
  B:/brainstorm|\bideas?\b|ideat|concept|naming|come up with/g,
  L:/learn|study|course|tutorial|train|exam|certif|lesson|homework|practice/g,
  E:/event|conference|party|wedding|logistic|schedule|itinerary|venue|trip|festival/g,
  S:/strateg|roadmap|plan|okr|goal|vision|prioriti|quarter|proposal/g,
  C:/code|coding|develop|program|debug|bug|software|\bapp\b|website|html|css|javascript|python|\bapi\b|script/g,
  O:/\bseo\b|keyword|search engine|backlink|ranking|meta/g,
  U:/user research|interview|usability|persona|user test|customer feedback|survey/g
};
const LANGY = 'WORLU';                       // language-heavy work: favor low-vocal music
const TARGET = {'Less than 1 hour':3,'1–2 hours':2,'2+ hours':1};   // energy 3 high, 2 moderate, 1 low
const EN = ['','steady, low-key','balanced, moderate','upbeat, high-energy'], VO = ['instrumental','light-vocal','vocal-forward'];
const LENP = {'Less than 1 hour':'a quick sprint','1–2 hours':'a steady session','2+ hours':'a long stretch'};


/* One unique note per song. Descriptions are built from these, so no two songs ever share the same line. */
const NOTES = {

he pace to a whisper","Dive|Tycho":"sunrise-bright synths with a steady, motivating pulse","Line of Sight":"a bright, uplifting build with an energetic drop","D.A.N.C.E.":"bouncy, glossy electro that adds instant energy","Don't Stop Me Now":"a piano-driven rush of pure confidence","The Pretender":"punchy guitar riffs that push you toward the finish line","Mr. Brightside":"a racing, singalong guitar rhythm that keeps adrenaline up","Uptown Funk":"brassy funk swagger that makes everything feel doable","Holocene":"soft, spacious falsetto that gives ideas room to breathe","Feather":"a mellow, jazzy beat with a soft, dusty warmth","Aruarian Dance":"a delicate piano and guitar loop with quiet, jazzy warmth","Time: The Donut of the Heart":"a loose, dusty drum groove with a shuffling swing","Since I Left You":"sun-drenched sampled strings and a sweeping, feel-good pulse","Remind Me":"a light, groovy electronic beat with a clean, polished feel","La Femme d'Argent":"silky, floating bass and keys that smooth out the mood","Midnight City":"big neon synths that fuel bold, fast ideas","Circles":"an easygoing guitar groove with a lazy, rolling feel","Sunflower":"a breezy, bright hook that keeps the mood light","Wow.":"a steady, confident bounce with a smooth, punchy hook","Better Now":"a mid-tempo, melodic pull that keeps you in the flow","Chemical":"a fizzing, anthemic build with a big, shouty hook","I Had Some Help":"a twangy, upbeat swagger that adds instant motivation","Baby|Justin Bieber":"a catchy, nostalgic hook you end up humming all day","Sorry":"a bright tropical-house pulse with a smooth, glossy groove","Love Yourself":"a stripped-back acoustic groove with a warm, sing-along hook","What Do You Mean?":"a bouncy, stuttering beat with a playful pulse","Boyfriend":"a smooth, breezy rhythm that keeps momentum steady","Peaches":"a laid-back, soulful groove that melts tension","Ghost":"a brisk, driving beat with relentless forward motion","Stay":"a rapid, pulsing pop rush that t drift on and on","Weightless":"engineered ambient layers that slow the pulse","Rhubarb":"a soft, drifting ambient wash that never demands attention","Vladimir's Blues":"a hushed, low-lit piano-and-strings drift","Monday Loop":"a warm, dusty lofi loop that settles into the background","Affection":"a mellow, jazzy lofi sway with a soft, tape-warm haze","Soon It Will Be Cold Enough":"a slow, glacial-electronic roll that holds a calm groove","So What":"a cool, walking bassline over lazy, brushed drums","Blue in Green":"a hushed, late-night piano and trumpet drift","Waltz for Debby":"a gentle piano trio that swings softly and quietly","My Favorite Things":"a hypnotic, modal jazz spiral that circles and expands","Cast Your Fate to the Wind":"a cozy jazz piano with a gentle, unhurried lilt","Cantaloupe Island":"a funky, easy-swinging jazz groove with an unmistakable piano riff","'Round Midnight":"a slow, smoky piano with a late-night, candlelit mood"
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* Library songs get energy from the researchers' length tag, or a default per category. */
const LIBE = {W:1,D:2,A:2,R:2,P:3,B:2,L:1,E:2,S:1}, INSTR = /marooned|cirrus|^time$|awake|a moment apart|lofi|any colour|shine on|echoes/i;
const CODE = Object.fromEntries(Object.entries(CAT).map(([k,v]) => [v,k]));
const LIBC = LIBRARY.filter(l => !l.egg).map(l => { const cat = CODE[l.task];
  return {title:l.title, artist:l.artist, src:'library', cat, cats:cat, vibe:l.vibe, lenTag:l.len, e:l.len ? TARGET[l.len] : LIBE[cat], v:INSTR.test(l.title) ? 0 : 1}; });

function recommend(task, len, n, playlist, random){
  const target = TARGET[len], low = task.toLowerCase();
  const found = Object.keys(RULES).map(k => [k, (low.match(RULES[k]) || []).length]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
  const cats = found.slice(0,2).map(x => x[0]), langy = cats.length > 0 && LANGY.includes(cats[0]);
  const score = c => { if (random) return Math.random();   // easter egg: pure shuffle
   
    let s = 0;
    if (c.src === 'library') { s += 1.5; if (c.cat === cats[0]) s += 6; else if (c.cat === cats[1]) s += 2.5; if (c.lenTag) s += c.lenTag === len ? 3 : -2; }
    else { if (cats[0] && c.cats.includes(cats[0])) s += 4; else if (cats[1] && c.cats.includes(cats[1])) s += 2; if (target === 3 && c.cats.includes('Q')) s += cats[0] ? 2.7 : 4.5; if (target === 2 && c.cats.includes('X')) s += cats[0] ? (langy ? .9 : 2.2) : 4; if (target === 1 && c.cats.includes('T')) s += cats[0] ? 1.5 : 4.5; }
    s -= Math.abs(c.e - target) * (c.src === 'library' && !c.lenTag ? .7 : 1.6);   // untagged library energy is only a default, so it counts less
    s -= (c.cats.includes('X') && target === 2) ? 0 : c.v * (langy || target === 1 ? 1.5 : target === 2 ? .5 : 0);
    return s + Math.random() * 1.2;               // small shuffle so Regenerate varies
  };
  const skip = new Set(recent.map(norm)), key = c => norm(c.title+' - '+c.artist);
  const ranked = [...LIBC, ...SUGG].map(c => [score(c), c]).sort((a,b) => b[0]-a[0]).map(x => x[1]);
  let pool = ranked.filter(c => !skip.has(key(c))); if (pool.length < n) pool = ranked;
  const per = playlist ? 2 : 1, cnt = {}, out = [];
  for (const c of pool) { if ((cnt[c.artist] || 0) >= per) continue; cnt[c.artist] = (cnt[c.artist] || 0) + 1; out.push(c); if (out.length === n) break; }
  if (playlist) out.sort((a,b) => Math.abs(a.e-target) - Math.abs(b.e-target));   // best energy fit first
  const label = cats[0] ? CAT[cats[0]].toLowerCase() : 'focused';
  const data = {
    energy_level: ['','Steady/Low','Moderate','High'][target],
    songs: out.map(c => ({title:c.title, artist:c.artist, source:c.src,
      why_it_fits: c.src === 'library' ? c.vibe : describe(c)}))
  };
  if (playlist) { data.playlist_name = 'Your Task Boombox'; data.playlist_description = `A ${EN[target]} run of ${n} tracks for ${LENP[len]}.`; }
  return data;
}

async function resolve(s){
  const lib = LIBRARY.find(l => norm(l.title)===norm(s.title) && norm(l.artist)===norm(s.artist));
  s.lib = !!lib; const id = lib && vid(lib.youtubeUrl);
  s.link = lib && lib.youtubeUrl ? lib.youtubeUrl : 'https://duckduckgo.com/?q='+encodeURIComponent('!ducky '+s.artist+' '+s.title+' official video site:youtube.com');   // jumps straight to the top YouTube result
  s.label = 'Play on YouTube';
  s.spotify = SP_IDS[norm(s.title+' | '+s.artist)] ? 'https://open.spotify.com/track/'+SP_IDS[norm(s.title+' | '+s.artist)] : 'https://duckduckgo.com/?q='+encodeURIComponent('!ducky '+s.artist+' '+s.title+' site:open.spotify.com/track');   // jumps straight to the Spotify track page
  const pin = YT_IDS[norm(s.title+' | '+s.artist)];   // exact video pinned in YT_IDS wins
  if (pin) { s.link = 'https://www.youtube.com/watch?v='+pin; s.art = 'https://img.youtube.com/vi/'+pin+'/hqdefault.jpg'; return; }
  if (id) { s.art = `https://img.youtube.com/vi/${id}/hqdefault.jpg`; return; }
  try {
    const j = await (await fetch('https://itunes.apple.com/search?entity=song&limit=1&term='+encodeURIComponent(s.title+' '+s.artist))).json();
    const a = j.results && j.results[0] && j.results[0].artworkUrl100;
    if (a) s.art = a.replace('100x100','600x600');
  } catch(e){}
}
const artHtml = s => `<div class="art">${s.art?`<img src="${esc(s.art)}" alt="" loading="lazy" onerror="this.remove()">`:''}${''}</div>`;

async function run(mode){
  const task = $('#task').value.trim(), len = (document.querySelector('input[name=len]:checked')||{}).value;
  const msg = $('#msg'); msg.textContent = '';
  if (!task) return msg.textContent = 'Describe what you are working on first.';
  if (task.length > 200 || /[.!?]\s+\S/.test(task)) return msg.textContent = 'Keep it to one sentence, under 200 characters.';
  if (!len) return msg.textContent = 'Pick how long the task will take.';
  const playlist = mode === 'playlist', n = playlist ? CONFIG.playlistLength : CONFIG.songCount;
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  $('#out').innerHTML = `<div class="grid">${'<div class="sk"></div>'.repeat(Math.min(n,6))}</div>`;
  const lines = ['Dialing in the flux capacitor…','Cueing up the right vibe…','Rewinding the cassette…']; let i = 0;
  msg.textContent = lines[0]; const t = setInterval(() => msg.textContent = lines[++i % lines.length], 1800);
  try {
    const egg = isEgg(task, len); let data = recommend(task, len, n, playlist, egg);   // egg: random songs, Rick himself never shown
    console.log('[HTTF]', task, len, data);
    await Promise.all(data.songs.map(resolve));
    if (egg) data.songs.forEach(s => { s.link = RICK_URL; s.label = 'Play on YouTube'; s.spotify = 'https://duckduckgo.com/?q='+encodeURIComponent('!ducky Rick Astley Never Gonna Give You Up site:open.spotify.com/track'); });
    if (isDeckEgg(task)) data.songs.forEach(s => { s.link = DECK_EGG_URL; s.spotify = DECK_EGG_URL; });   // real song picks, every link points to the deck egg video
    last = {task, len, data}; recent = [...data.songs.map(s => s.title+' - '+s.artist), ...recent].slice(0,25);
    render(data, playlist); msg.textContent = '';
  } catch(e){
    $('#out').innerHTML = '';
        msg.textContent = 'Something went wrong getting your music. Press the button to try again.';
    console.error('[HTTF]', e);
  } finally { clearInterval(t); document.querySelectorAll('.btn').forEach(b => b.disabled = false); }
}

const links = s => `<div class="links"><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Play on YouTube</a><a class="sp" href="${esc(s.spotify)}" target="_blank" rel="noopener noreferrer">Play on Spotify</a></div>`;
function render(d, playlist){
  const head = `<div class="summary"><span class="energy">${esc(d.energy_level)} energy</span></div>`;
  let body;
  if (playlist) {
    body = `<h2 style="font-family:var(--font-title);color:var(--cyan);margin:0 0 4px">${esc(d.playlist_name)}</h2><p style="margin:0 0 16px;color:var(--muted)">${esc(d.playlist_description)}</p>
      <ol class="pl">${d.songs.map(s => `<li>${artHtml(s)}<div><b>${esc(s.title)}</b> · ${esc(s.artist)}<small>${esc(s.why_it_fits)}</small>${links(s)}</div></li>`).join('')}</ol>`;
  } else {
    body = `<div class="grid">${d.songs.map(s => `<article class="card">${artHtml(s)}
      <div class="info"><h3>${esc(s.title)}</h3><div class="by">${esc(s.artist)}</div><p>${esc(s.why_it_fits)}</p>
      ${links(s)}</div></article>`).join('')}</div>`;
  }
  $('#out').innerHTML = head + body + `<div class="row">
    ${playlist ? '<button class="btn alt" id="cp">Copy playlist as text</button><button class="btn" id="re">Back to songs</button>'
               : '<button class="btn" id="pl">Build me a playlist</button><button class="btn alt" id="re">Regenerate</button>'}</div>`;
  const cp = $('#cp'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(d.songs.map(s => s.title+' – '+s.artist).join('\n')); cp.textContent = 'Copied'; } catch(e){ cp.textContent = 'Copy failed'; } };
  const pl = $('#pl'); if (pl) pl.onclick = () => run('playlist');
  $('#re').onclick = () => run('songs');
}
$('#go').onclick = () => run('songs');
$('#task').addEventListener('keydown', e => { if (e.key === 'Enter') run('songs'); });
</script>
</body>
</html>
